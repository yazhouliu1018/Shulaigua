<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #140f0b;
            font-family: 'Noto Serif SC', serif;
        }
        .font-calligraphy {
            font-family: 'Ma Shan Zheng', cursive, serif;
        }

        /* 签筒在桌面上待机摇晃动画 */
        @keyframes canisterIdleShake {
            0%, 100% { transform: translate(-50%, 0) rotate(0deg); }
            15% { transform: translate(-50%, -5px) rotate(-7deg); }
            30% { transform: translate(-50%, -2px) rotate(7deg); }
            45% { transform: translate(-50%, -4px) rotate(-5deg); }
            60% { transform: translate(-50%, 0) rotate(4deg); }
            75% { transform: translate(-50%, 0) rotate(0deg); }
        }
        .canister-idle-anim {
            animation: canisterIdleShake 2.1s infinite ease-in-out;
        }

        /* 点击签筒后向上抛掷出画外的过渡动画 */
        @keyframes canisterThrowUp {
            0% { transform: translate(-50%, 0) scale(1) rotate(0deg); opacity: 1; }
            25% { transform: translate(-50%, 25px) scale(1.08) rotate(-12deg); opacity: 1; }
            100% { transform: translate(-50%, -115vh) scale(0.65) rotate(380deg); opacity: 0; }
        }
        .canister-throw-anim {
            animation: canisterThrowUp 1.05s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        /* 旋转太极八卦铜盘 */
        @keyframes taijiSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .taiji-spin {
            animation: taijiSpin 3.6s linear infinite;
        }

        /* 手机摇晃引导动画 */
        @keyframes tiltPhone {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-25deg); }
            75% { transform: rotate(25deg); }
        }
        .tilt-anim {
            animation: tiltPhone 1.5s infinite ease-in-out;
            transform-origin: bottom center;
        }
    </style>
</head>

        function resizeStage() {

        class AntiqueAudio {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playThrowCanister() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                for (let i = 0; i < 5; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520 + i * 95, now + i * 0.08);
                    gain.gain.setValueAtTime(0.12, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.07);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.07);
                }
            }
            playSneakyDodge() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(380, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.16);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.17);
            }
            playCatchCharm() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(660, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.22);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }
        const sfx = new AntiqueAudio();

        function buildCandidateUrls(fileNameOrUrl) {
            const raw = fileNameOrUrl.trim();
            if (raw.startsWith('blob:') || raw.startsWith('http')) {
                return [raw, raw];
            }
            let cleanName = raw.replace(/^\/+/, '');
            if (!/\.(mp4|webm|mov)$/i.test(cleanName)) {
                cleanName += '.mp4';
            }
            const encoded = encodeURIComponent(cleanName);
            return [
                `https://cdn.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@${GH_BRANCH}/${encoded}`,
                `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/${GH_BRANCH}/${encoded}`
            ];
        }

        function preloadSingleVideoSlot(slotKey, fileNameOrUrl) {
            return new Promise((resolve) => {
                const candidates = buildCandidateUrls(fileNameOrUrl);
                let attemptIdx = 0;

                function tryNextCandidate() {
                    if (attemptIdx >= candidates.length) {
                        resolve({ slotKey, ok: false, url: "" });
                        return;
                    }
                    const testUrl = candidates[attemptIdx++];
                    const vid = preloadedVideos[slotKey];
                    vid.muted = true; // 预加载时强制静音
                    
                    let settled = false;
                    const timeoutId = setTimeout(() => {
                        if (settled) return;
                        settled = true;
                        cleanup();
                        tryNextCandidate();
                    }, 8000);

                    function onReady() {
                        if (settled) return;
                        settled = true;
                        cleanup();
                        resolve({ slotKey, ok: true, url: testUrl });
                    }

                    function onError() {
                        if (settled) return;
                        settled = true;
                        cleanup();
                        tryNextCandidate();
                    }

                    function cleanup() {
                        clearTimeout(timeoutId);
                        vid.removeEventListener('canplaythrough', onReady);
                        vid.removeEventListener('loadeddata', onReady);
                        vid.removeEventListener('error', onError);
                    }

                    vid.addEventListener('canplaythrough', onReady, { once: true });
                    vid.addEventListener('loadeddata', onReady, { once: true });
                    vid.addEventListener('error', onError, { once: true });
                    vid.src = testUrl;
                    vid.load();
                }
                tryNextCandidate();
            });
        }

        async function preloadAllThreeVideos(name1, name2, name3) {
            const barFill = document.getElementById('loading-bar-fill');
            barFill.style.width = '15%';

            let finishedCount = 0;
            const updateProgress = () => {
                finishedCount++;
                const pct = Math.min(100, Math.round((finishedCount / 3) * 100));
                barFill.style.width = `${pct}%`;
            };

            await Promise.all([
                preloadSingleVideoSlot('state1', name1).then(r => { updateProgress(); return r; }),
                preloadSingleVideoSlot('state2', name2).then(r => { updateProgress(); return r; }),
                preloadSingleVideoSlot('state3', name3).then(r => { updateProgress(); return r; })
            ]);

            videoSources.loaded = true;

            // ！！！核心微信适配：在第一次点击时，强制所有视频预播放，解锁音频权限 ！！！
            setTimeout(() => {
                document.getElementById('loading-progress-container').classList.add('hidden');
                const enterBtn = document.getElementById('enter-game-btn');
                enterBtn.classList.remove('hidden');
                
                enterBtn.addEventListener('click', () => {
                    document.getElementById('loading-screen').classList.add('opacity-0', 'pointer-events-none');
                    
                    // 解除静音
                    preloadedVideos.state1.muted = false;
                    preloadedVideos.state2.muted = false;
                    preloadedVideos.state3.muted = false;

                    // 骗取全部视频的播放权限（一次性全部唤醒，然后关掉不需要的）
                    let p1 = preloadedVideos.state1.play();
                    let p2 = preloadedVideos.state2.play();
                    let p3 = preloadedVideos.state3.play();

                    if (p1 !== undefined) p1.catch(() => {});
                    if (p2 !== undefined) p2.then(() => preloadedVideos.state2.pause()).catch(() => {});
                    if (p3 !== undefined) p3.then(() => preloadedVideos.state3.pause()).catch(() => {});

                    // 微信强制循环补丁：防止微信无视 loop 属性
                    preloadedVideos.state1.addEventListener('ended', function() {
                        this.currentTime = 0;
                        this.play().catch(()=>{});
                    });
                    preloadedVideos.state2.addEventListener('ended', function() {
                        this.currentTime = 0;
                        this.play().catch(()=>{});
                    });

                    // 同步直接调用播放
                    playVideoForCurrentPhase();
                }, { once: true });

                // 微信专有：尝试监听 WeixinJSBridgeReady 提前准备
                document.addEventListener("WeixinJSBridgeReady", function () {
                    Object.values(preloadedVideos).forEach(vid => vid.load());
                }, false);

            }, 400);
        }

        function playVideoForCurrentPhase() {
            if (!videoSources.loaded) return;

            const v1 = preloadedVideos.state1;
            const v2 = preloadedVideos.state2;
            const v3 = preloadedVideos.state3;

            // 彻底弃用 opacity 渐变，直接使用最安全的 display 属性强行切换，避开微信渲染卡死 BUG
            v1.style.display = 'none';
            v2.style.display = 'none';
            v3.style.display = 'none';

            if (state.phase === 'STATE_1') {
                v1.style.display = 'block';
                v2.pause(); v3.pause();
                v1.play().catch(() => {});
            } else if (state.phase === 'STATE_2_THROW' || state.phase === 'STATE_2_PLAY') {
                v2.style.display = 'block';
                v1.pause(); v3.pause();
                if (state.phase === 'STATE_2_THROW') v2.currentTime = 0; // 从头播放看戏
                v2.play().catch(() => {});
            } else if (state.phase === 'STATE_3') {
                v3.style.display = 'block';
                v1.pause(); v2.pause();
                v3.currentTime = 0;
                v3.play().catch(() => {});
            }
        }

        function enterState1() {
            state.phase = 'STATE_1';
            state.caughtCount = 0;
            state.charms = [];
            state.toasts = [];
            state.canSpawn = false;
            caughtCountEl.textContent = '0';

            whiteVeil.classList.add('opacity-0');
            hudCounter.classList.add('hidden');
            quickResetBtn.classList.add('hidden');

            deskCanisterBtn.classList.remove('hidden', 'canister-throw-anim');
            deskCanisterBtn.classList.add('canister-idle-anim');

            ratDialogue.innerHTML = '🐭 <strong>鼠摊主</strong>：“教大赶Due头秃？Canteen不知吃啥？点桌上的签筒，本摊主替你卜一卦！”';

            playVideoForCurrentPhase();
        }

        deskCanisterBtn.addEventListener('click', async () => {
            if (state.phase !== 'STATE_1') return;
            
            // 重要修复：在异步 await 之前立刻切换视频状态，保住微信对“用户点击”的合法判定！
            state.phase = 'STATE_2_THROW';
            deskCanisterBtn.classList.remove('canister-idle-anim');
            deskCanisterBtn.classList.add('canister-throw-anim');
            ratDialogue.innerHTML = '🐭 <strong>鼠摊主</strong>：“看招！签筒飞上天咯——左右倾斜手机（或滑动屏幕）去接灵符吧！”';
            playVideoForCurrentPhase();
            sfx.playThrowCanister();

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm === 'granted') {
                        document.getElementById('gyro-indicator').textContent = '(陀螺仪已开启)';
                    }
                } catch (e) {}
            }

            // 锁死时间轴：整整 3 秒后，白幕、引导和第一个卦符才开始出现
            setTimeout(() => {
                if (state.phase !== 'STATE_2_THROW') return;
                deskCanisterBtn.classList.add('hidden');
            }, 1000);

            setTimeout(() => {
                if (state.phase !== 'STATE_2_THROW') return;
                
                state.phase = 'STATE_2_PLAY';
                
                whiteVeil.classList.remove('opacity-0');
                hudCounter.classList.remove('hidden');
                quickResetBtn.classList.remove('hidden');
                
                const tiltGuide = document.getElementById('tilt-guide');
                tiltGuide.classList.remove('opacity-0');
                setTimeout(() => {
                    tiltGuide.classList.add('opacity-0');
                }, 3000);

                state.canSpawn = true;
                state.lastSpawnTime = performance.now();
                spawnFallingCharm();
                
            }, 3000);
        });

        const TRIGRAM_LIST = [
            { name: '乾', symbol: '☰', desc: '天' },
            { name: '坤', symbol: '☷', desc: '地' },
            { name: '离', symbol: '☲', desc: '火' },
            { name: '坎', symbol: '☵', desc: '水' },
            { name: '震', symbol: '☳', desc: '雷' },
            { name: '巽', symbol: '☴', desc: '风' }
        ];

        function spawnFallingCharm() {
            if (state.phase !== 'STATE_2_PLAY') return;
            const trigram = TRIGRAM_LIST[Math.floor(Math.random() * TRIGRAM_LIST.length)];
            // 心机躲闪概率 75%
            const isSneaky = Math.random() < 0.75;

            state.charms.push({
                x: (0.18 + Math.random() * 0.64) * state.width,
                y: -60,
                vx: 0,
                vy: isSneaky ? (2.0 + Math.random() * 0.6) : (3.5 + Math.random() * 1.0),
                rotation: (Math.random() - 0.5) * 0.25,
                vRot: (Math.random() - 0.5) * 0.015,
                trigram,
                isSneaky,
                hasDodged: false
            });
        }

        function addFloatingToast(x, y, text, color = '#8c2318') {
            state.toasts.push({ x, y, text, color, alpha: 1, dy: -1.0 });
        }

        function enterState3() {
            state.phase = 'STATE_3';
            state.charms = [];
            whiteVeil.classList.add('opacity-0');
            hudCounter.classList.add('hidden');
            quickResetBtn.classList.add('hidden');

            ratDialogue.innerHTML = '🐭 <strong>鼠摊主</strong>（收起坏笑端庄奉上）：“客官请看您的上上灵签——”';

            playVideoForCurrentPhase();

            // 监听视频3播放结束
            preloadedVideos.state3.onended = () => {
                if (state.phase === 'STATE_3' && document.getElementById('scroll-modal').classList.contains('opacity-0')) {
                    openScrollModal();
                }
            };

            // 保底机制：10秒后强制展示卷轴（防止视频卡顿导致不触发onended）
            setTimeout(() => {
                if (state.phase === 'STATE_3' && document.getElementById('scroll-modal').classList.contains('opacity-0')) {
                    openScrollModal();
                }
            }, 10000);
        }

        function openScrollModal() {
            const modal = document.getElementById('scroll-modal');
            const oracle = EDUHK_ORACLES[Math.floor(Math.random() * EDUHK_ORACLES.length)];
            document.getElementById('scroll-tag').textContent = oracle.tag;
            document.getElementById('scroll-title').textContent = oracle.title;
            document.getElementById('scroll-advice').textContent = oracle.advice;

            const contentEl = document.getElementById('scroll-content');
            contentEl.textContent = '';
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');

            let i = 0;
            const timer = setInterval(() => {
                if (i < oracle.content.length) {
                    contentEl.textContent += oracle.content[i++];
                } else {
                    clearInterval(timer);
                }
            }, 42);
        }

        document.getElementById('again-btn').addEventListener('click', () => {
            const modal = document.getElementById('scroll-modal');
            modal.classList.add('pointer-events-none', 'opacity-0');
            modal.classList.remove('opacity-100');
            enterState1();
        });
        quickResetBtn.addEventListener('click', enterState1);

        window.addEventListener('deviceorientation', (e) => {
            if (state.phase !== 'STATE_2_PLAY' || e.gamma === null) return;
            const clamped = Math.max(-35, Math.min(35, e.gamma));
            state.playerX = 0.12 + ((clamped + 35) / 70) * 0.76;
        });

        const appStage = document.getElementById('app-stage');
        appStage.addEventListener('touchmove', (e) => {
            if (state.phase !== 'STATE_2_PLAY') return;
            const rect = appStage.getBoundingClientRect();
            const relX = (e.touches[0].clientX - rect.left) / rect.width;
            state.playerX = Math.max(0.12, Math.min(0.88, relX));
        }, { passive: true });

        appStage.addEventListener('mousemove', (e) => {
            if (state.phase !== 'STATE_2_PLAY') return;
            const rect = appStage.getBoundingClientRect();
            const relX = (e.clientX - rect.left) / rect.width;
            state.playerX = Math.max(0.12, Math.min(0.88, relX));
        });

        function drawEdUHKSceneFallback(ctx, w, h, now) {
            if (videoSources.loaded && preloadedVideos.state1.readyState >= 2) {
                return;
            }
            const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.65);
            skyGrad.addColorStop(0, '#9ec5e8');
            skyGrad.addColorStop(0.5, '#d7e6f0');
            skyGrad.addColorStop(1, '#e8dac7');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);
        }

        function updateAndDrawState2Game(ctx, w, h, now) {
            if (state.phase === 'STATE_2_PLAY') {
                if (state.canSpawn && now - state.lastSpawnTime > 1550) {
                    state.lastSpawnTime = now;
                    spawnFallingCharm();
                }

                const targetPlayerPx = state.playerX * w;
                const playerCanisterX = targetPlayerPx;
                const playerCanisterY = h * 0.83;

                for (let i = state.charms.length - 1; i >= 0; i--) {
                    const c = state.charms[i];
                    c.y += c.vy;
                    c.x += c.vx;
                    c.rotation += c.vRot;
                    c.vx *= 0.94;

                    if (c.x < 30) { c.x = 30; c.vx = -c.vx; }
                    if (c.x > w - 30) { c.x = w - 30; c.vx = -c.vx; }

                    const dx = c.x - playerCanisterX;
                    const dy = c.y - playerCanisterY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    const distYFromTop = playerCanisterY - c.y;

                    // 心机躲闪逻辑判定
                    if (c.isSneaky && !c.hasDodged && distYFromTop > 30 && distYFromTop < 140 && Math.abs(dx) < 65) {
                        c.hasDodged = true;
                        sfx.playSneakyDodge();
                        const dodgeDir = c.x < w / 2 ? 1 : -1;
                        c.vx = dodgeDir * (12 + Math.random() * 5);
                        c.vy = 4.5;
                        
                        const dodgeTexts = ["略略略~", "闪身步！", "走位！", "嘿嘿，空了！", "没接住吧~"];
                        const randomText = dodgeTexts[Math.floor(Math.random() * dodgeTexts.length)];
                        addFloatingToast(c.x, c.y - 20, randomText, "#9e2a2b");
                    }

                    // 缩小判定范围到 32，需要接得更准
                    if (dist < 32) {
                        sfx.playCatchCharm();
                        state.charms.splice(i, 1);
                        state.caughtCount++;
                        caughtCountEl.textContent = state.caughtCount;
                        addFloatingToast(playerCanisterX, playerCanisterY - 40, `+1 灵符 (${state.caughtCount}/3)`, "#2d6a4f");

                        if (state.caughtCount >= 3) {
                            enterState3();
                        }
                        continue;
                    }

                    if (c.y > h + 70) {
                        state.charms.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.rotate(c.rotation);

                    ctx.shadowColor = 'rgba(0,0,0,0.35)';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#f3e2be';
                    ctx.strokeStyle = '#5c381a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    // 灵符缩小
                    ctx.roundRect(-16, -26, 32, 52, 4);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#8c2318';
                    ctx.font = 'bold 14px "Noto Serif SC", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(c.trigram.name, 0, -6);
                    ctx.font = '9px sans-serif';
                    ctx.fillText(c.trigram.symbol, 0, 10);

                    ctx.restore();
                }
            }

            for (let i = state.toasts.length - 1; i >= 0; i--) {
                const t = state.toasts[i];
                t.y += t.dy;
                // 减慢文字透明度消失的速度
                t.alpha -= 0.006;
                if (t.alpha <= 0) {
                    state.toasts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = Math.max(0, t.alpha);
                ctx.font = 'bold 16px "Noto Serif SC", serif';
                ctx.fillStyle = t.color;
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255,255,255,0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(t.text, t.x, t.y);
                ctx.restore();
            }

            if (state.phase === 'STATE_2_PLAY') {
                const px = state.playerX * w;
                const py = h * 0.83;
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 15;
                if (qiantongImg.complete && qiantongImg.naturalHeight > 0) {
                    const imgWidth = 90;
                    const imgHeight = 120;
                    ctx.drawImage(qiantongImg, px - imgWidth / 2, py - imgHeight / 2 + 10, imgWidth, imgHeight);
                } else {
                    ctx.fillStyle = '#d4af37';
                    ctx.beginPath();
                    ctx.ellipse(px, py + 45, 32, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function mainLoop(now) {
            sceneCtx.clearRect(0, 0, state.width, state.height);
            gameCtx.clearRect(0, 0, state.width, state.height);

            drawEdUHKSceneFallback(sceneCtx, state.width, state.height, now);
            updateAndDrawState2Game(gameCtx, state.width, state.height, now);

            requestAnimationFrame(mainLoop);
        }

        async function scanGithubRepo() {
            try {
                const api = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents`;
                const res = await fetch(api);
                if (!res.ok) throw new Error("API limit or repo not found");
                const list = await res.json();
                const mp4s = list.filter(item => item.type === 'file' && /\.mp4$/i.test(item.name));
                if (mp4s.length > 0) {
                    const findByName = (kw) => {
                        const found = mp4s.find(m => m.name.toLowerCase().includes(kw));
                        return found ? found.name : "";
                    };
                    const n1 = findByName('v1') || DEFAULT_VIDEO_NAMES.state1;
                    const n2 = findByName('v2') || DEFAULT_VIDEO_NAMES.state2;
                    const n3 = findByName('v3') || DEFAULT_VIDEO_NAMES.state3;
                    preloadAllThreeVideos(n1, n2, n3);
                } else {
                    preloadAllThreeVideos(DEFAULT_VIDEO_NAMES.state1, DEFAULT_VIDEO_NAMES.state2, DEFAULT_VIDEO_NAMES.state3);
                }
            } catch (e) {
                preloadAllThreeVideos(DEFAULT_VIDEO_NAMES.state1, DEFAULT_VIDEO_NAMES.state2, DEFAULT_VIDEO_NAMES.state3);
            }
        }

        window.addEventListener('load', () => {
            resizeStage();
            scanGithubRepo();
            requestAnimationFrame(mainLoop);
        });
    </script>
</body>
</html>
